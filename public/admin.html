<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GoodTrip 清邁店 — 預約後台</title>
<style>
  :root {
    --bg: #14120f; --card: #1d1b17; --card2: #262218; --line: #3a342c;
    --text: #f2eee6; --muted: #a49c8e; --accent: #7fc04a; --warn: #e0a33c; --err: #e26d5a;
    --closed: #221f1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
    font-size: 14px;
  }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--card);
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; margin-right: auto; display: flex; align-items: center; gap: 10px; }
  header h1 img { height: 30px; }
  button {
    font-family: inherit; font-size: 13px; padding: 7px 12px; cursor: pointer;
    color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 8px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #10240a; border-color: var(--accent); font-weight: 700; }
  button.danger { color: #ffd9d1; border-color: var(--err); }
  .range { color: var(--muted); font-size: 13px; width: 100%; }

  .scroll { overflow-x: auto; padding: 14px; }
  table { border-collapse: collapse; width: 100%; min-width: 1050px; }
  th, td { border: 1px solid var(--line); vertical-align: top; padding: 6px; }
  th { background: var(--card); font-size: 13px; font-weight: 600; }
  th.today { color: var(--accent); }
  th.slotcol, td.slotcol { width: 96px; background: var(--card); font-size: 12.5px; white-space: nowrap; }
  td { width: calc((100% - 96px) / 7); background: var(--card); }
  td.closed { background: var(--closed); color: var(--muted); text-align: center; font-size: 12px; }
  .cellhead { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .cellhead .cnt { font-weight: 700; color: var(--text); }
  .cellhead.full .cnt { color: var(--err); }
  .cellhead .whole { color: var(--warn); }
  .cellhead .add { margin-left: auto; padding: 1px 7px; font-size: 13px; line-height: 1.4; }
  .chip {
    background: var(--card2); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 6px; padding: 5px 7px; margin-bottom: 4px; cursor: pointer; font-size: 12.5px;
  }
  .chip:hover { border-color: var(--accent); }
  .chip.warn { border-left-color: var(--err); }
  .chip .nm { font-weight: 600; }
  .chip .meta { color: var(--muted); font-size: 11.5px; }
  .tag { display: inline-block; font-size: 10.5px; padding: 0 4px; border-radius: 4px; background: #33302a; color: var(--muted); margin-left: 4px; }
  .tag.first { background: #2c3a1f; color: var(--accent); }
  .tag.err { background: #3a201c; color: #ffd9d1; }
  .empty { color: #6b655b; font-size: 12px; }

  .mask { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 10; }
  .mask.on { display: block; }
  .modal {
    position: fixed; z-index: 11; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(460px, 94vw); max-height: 90vh; overflow: auto; display: none;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
  }
  .modal.on { display: block; }
  .modal h2 { font-size: 16px; margin: 0 0 12px; }
  .modal label { display: block; font-size: 12.5px; color: var(--muted); margin: 12px 0 4px; }
  .modal input, .modal select, .modal textarea {
    width: 100%; padding: 9px; font-size: 15px; font-family: inherit;
    color: var(--text); background: var(--card2); border: 1px solid var(--line); border-radius: 8px;
  }
  .row2 { display: flex; gap: 10px; }
  .row2 > div { flex: 1; }
  .acts { display: flex; gap: 8px; margin-top: 18px; }
  .acts .primary { margin-left: auto; }
  .mmsg { margin-top: 12px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; white-space: pre-line; }
  .mmsg.on { display: block; background: #3a201c; border: 1px solid var(--err); color: #ffd9d1; }
  .chk { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; }
  .chk input { width: auto; }
  #loading { padding: 40px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1><img src="/logo.png" alt="">預約後台</h1>
  <button id="prev">← 上一週</button>
  <button id="this">本週</button>
  <button id="next">下一週 →</button>
  <button id="reload">重新整理</button>
  <button class="primary" id="addNew">＋ 手動新增</button>
  <div class="range" id="range"></div>
</header>

<div id="loading">載入中…</div>
<div class="scroll" id="scroll" style="display:none"><table id="grid"></table></div>

<div class="mask" id="mask"></div>
<div class="modal" id="modal">
  <h2 id="mTitle">預約</h2>
  <input type="hidden" id="fId">
  <label>預約人（綽號或本名）</label>
  <input type="text" id="fName" maxlength="60">
  <div class="row2">
    <div>
      <label>日期</label>
      <input type="date" id="fDate">
    </div>
    <div>
      <label>人數</label>
      <input type="number" id="fPax" min="1" step="1">
    </div>
  </div>
  <div class="row2">
    <div>
      <label>時段</label>
      <select id="fSlot"></select>
    </div>
    <div>
      <label>第一次接觸</label>
      <select id="fFirst"><option value="是">是</option><option value="否">否</option></select>
    </div>
  </div>
  <div class="row2">
    <div>
      <label>來源</label>
      <select id="fSource">
        <option value="WALK_IN">現場上門</option>
        <option value="LINE">LINE</option>
        <option value="PHONE">電話</option>
        <option value="WEB">網路預約</option>
      </select>
    </div>
    <div>
      <label>LINE</label>
      <input type="text" id="fLine" maxlength="80">
    </div>
  </div>
  <label>Email（留空則不寄確認信）</label>
  <input type="email" id="fEmail">
  <label>從哪邊知道我們的（選填）</label>
  <select id="fReferral">
    <option value="">未填</option>
    <option value="Instagram">Instagram</option>
    <option value="Threads">Threads</option>
    <option value="GoodTrip官網">GoodTrip官網</option>
    <option value="GoodTrip門市">GoodTrip門市</option>
    <option value="親友介紹">親友介紹</option>
    <option value="網路搜尋">網路搜尋</option>
  </select>
  <label>備註</label>
  <input type="text" id="fNote" maxlength="200">
  <div class="chk" id="mailChk"><input type="checkbox" id="fSendMail"><label for="fSendMail" style="margin:0">新增後寄出確認信</label></div>
  <div class="mmsg" id="mMsg"></div>
  <div class="acts">
    <button id="mCancelBooking" class="danger" style="display:none">取消此預約</button>
    <button id="mClose">關閉</button>
    <button id="mSave" class="primary">儲存</button>
  </div>
</div>

<script>
  var TOKEN = new URLSearchParams(location.search).get('token') || '';
  var week = null;
  var monday = '';          // 空字串 = 讓後端用本週
  var editing = null;       // null = 新增模式
  var pendingForce = false;

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  };

  async function api(path, options) {
    options = options || {};
    options.headers = Object.assign({ 'X-Admin-Token': TOKEN }, options.headers || {});
    var res = await fetch(path, options);
    var data = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(data.error || '連線失敗，請稍後再試。');
    return data;
  }

  function load(m) {
    if (m !== undefined) monday = m;
    $('loading').style.display = 'block';
    $('loading').textContent = '載入中…';
    api('/api/admin/week' + (monday ? '?monday=' + encodeURIComponent(monday) : ''))
      .then(function (data) { week = data; monday = data.monday; render(); })
      .catch(function (err) { $('loading').textContent = err.message || '載入失敗'; });
  }

  function render() {
    $('range').textContent = week.rangeLabel;
    var html = '<tr><th class="slotcol">時段</th>';
    week.days.forEach(function (d) {
      html += '<th class="' + (d.isToday ? 'today' : '') + '">' + d.weekday + ' ' + d.dayLabel +
        (d.closed ? '（公休）' : '') + (d.isToday ? ' ●' : '') + '</th>';
    });
    html += '</tr>';

    week.slotDefs.forEach(function (sd, si) {
      html += '<tr><td class="slotcol">' + sd.slot + '</td>';
      week.days.forEach(function (d, di) {
        if (d.closed) { html += '<td class="closed">公休</td>'; return; }
        html += '<td>' + cellHtml(d, d.slots[si], di, si) + '</td>';
      });
      html += '</tr>';
    });

    $('grid').innerHTML = html;
    $('loading').style.display = 'none';
    $('scroll').style.display = 'block';

    Array.prototype.forEach.call(document.querySelectorAll('.chip'), function (el) {
      el.addEventListener('click', function () {
        var d = week.days[Number(el.dataset.d)];
        var b = d.slots[Number(el.dataset.s)].bookings[Number(el.dataset.i)];
        openEdit(b);
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.add'), function (el) {
      el.addEventListener('click', function () {
        openNew(week.days[Number(el.dataset.d)].date, week.slotDefs[Number(el.dataset.s)].slot);
      });
    });
  }

  function cellHtml(day, cell, di, si) {
    var head;
    if (cell.groups === 0) {
      head = '<span class="cnt">—</span>';
    } else if (cell.isWholeVenue) {
      head = '<span class="cnt">' + cell.totalPax + ' 人</span><span class="whole">包場</span>';
    } else {
      head = '<span class="cnt">' + cell.totalPax + ' / ' + week.maxPax + '</span>' +
        '<span>' + cell.groups + ' 組</span>' +
        (cell.full ? '<span style="color:var(--err)">已滿</span>' : '');
    }
    var out = '<div class="cellhead' + (cell.full ? ' full' : '') + '">' + head +
      '<button class="add" data-d="' + di + '" data-s="' + si + '" title="手動新增">＋</button></div>';

    if (cell.groups === 0) return out + '<div class="empty">無預約</div>';

    cell.bookings.forEach(function (b, i) {
      var bad = b.mailFailed;
      out += '<div class="chip' + (bad ? ' warn' : '') + '" data-d="' + di + '" data-s="' + si + '" data-i="' + i + '">' +
        '<div class="nm">' + esc(b.name) + ' <span class="cnt">x' + b.pax + '</span>' +
          (b.firstTime === '是' ? '<span class="tag first">初次</span>' : '') +
          (b.source !== 'WEB' ? '<span class="tag">' + sourceLabel(b.source) + '</span>' : '') +
          (b.mailFailed ? '<span class="tag err">信未寄出</span>' : '') +
        '</div>' +
        '<div class="meta">' + (b.line ? 'LINE ' + esc(b.line) + ' · ' : '') + esc(b.email || '無 Email') +
          (b.referral ? ' · 來自 ' + esc(b.referral) : '') + '</div>' +
        (b.note ? '<div class="meta">📝 ' + esc(b.note) + '</div>' : '') +
        '</div>';
    });
    return out;
  }

  function sourceLabel(s) {
    return { WALK_IN: '現場', LINE: 'LINE', PHONE: '電話', WEB: '網路' }[s] || s;
  }

  // ---------------- Modal
  function slotOptions(selected) {
    return week.slotDefs.map(function (s) {
      return '<option value="' + s.slot + '"' + (s.slot === selected ? ' selected' : '') + '>' + s.slot + '</option>';
    }).join('');
  }

  function openModal() {
    $('mMsg').className = 'mmsg';
    pendingForce = false;
    $('mSave').textContent = '儲存';
    $('mask').className = 'mask on';
    $('modal').className = 'modal on';
  }
  function closeModal() {
    $('mask').className = 'mask';
    $('modal').className = 'modal';
  }

  function openNew(dateStr, slot) {
    editing = null;
    $('mTitle').textContent = '手動新增預約';
    $('fId').value = '';
    $('fName').value = '';
    $('fDate').value = dateStr || week.days[0].date;
    $('fPax').value = 1;
    $('fSlot').innerHTML = slotOptions(slot || week.slotDefs[0].slot);
    $('fFirst').value = '否';
    $('fSource').value = 'WALK_IN';
    $('fLine').value = '';
    $('fEmail').value = '';
    $('fReferral').value = '';
    $('fNote').value = '';
    $('fSendMail').checked = false;
    $('mailChk').style.display = 'flex';
    $('fSource').disabled = false;
    $('mCancelBooking').style.display = 'none';
    openModal();
  }

  function openEdit(b) {
    editing = b;
    $('mTitle').textContent = '編輯預約 · ' + b.name;
    $('fId').value = b.id;
    $('fName').value = b.name;
    $('fDate').value = b.date;
    $('fPax').value = b.pax;
    $('fSlot').innerHTML = slotOptions(b.slot);
    $('fFirst').value = b.firstTime === '是' ? '是' : '否';
    $('fSource').value = b.source || 'WEB';
    $('fSource').disabled = true;
    $('fLine').value = b.line;
    $('fEmail').value = b.email;
    $('fReferral').value = b.referral || '';
    $('fNote').value = b.note;
    $('mailChk').style.display = 'none';
    $('mCancelBooking').style.display = 'inline-block';
    openModal();
  }

  function payload() {
    return {
      id: $('fId').value,
      name: $('fName').value.trim(),
      pax: Number($('fPax').value),
      date: $('fDate').value,
      slot: $('fSlot').value,
      firstTime: $('fFirst').value,
      source: $('fSource').value,
      line: $('fLine').value.trim(),
      email: $('fEmail').value.trim(),
      referral: $('fReferral').value,
      note: $('fNote').value.trim(),
      sendMail: $('fSendMail').checked,
      force: pendingForce
    };
  }

  function showMMsg(text) {
    $('mMsg').textContent = text;
    $('mMsg').className = 'mmsg on';
  }

  function busy(on) {
    $('mSave').disabled = on;
    if (on) $('mSave').textContent = '處理中…';
  }

  $('mSave').addEventListener('click', function () {
    var p = payload();
    if (!p.name) return showMMsg('請填寫預約人。');
    if (!p.date) return showMMsg('請選擇日期。');
    if (!p.pax || p.pax < 1) return showMMsg('請填寫人數。');
    busy(true);

    var req = editing
      ? api('/api/admin/bookings/' + encodeURIComponent(p.id), {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(p)
        })
      : api('/api/admin/bookings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(p)
        });

    req.then(function (res) {
      busy(false);
      if (res && res.needsForce) {
        pendingForce = true;
        showMMsg(res.reason + '\n\n若確定要超額安排，請再按一次「強制儲存」。');
        $('mSave').textContent = '強制儲存';
        return;
      }
      closeModal();
      load();
    }).catch(function (err) {
      busy(false);
      $('mSave').textContent = pendingForce ? '強制儲存' : '儲存';
      showMMsg(err.message || '操作失敗。');
      // 超額訊息 → 提供強制儲存
      if (/上限|剩/.test(err.message || '')) {
        pendingForce = true;
        $('mSave').textContent = '強制儲存';
      }
    });
  });

  $('mCancelBooking').addEventListener('click', function () {
    if (!editing) return;
    if (!confirm('確定要取消「' + editing.name + ' x' + editing.pax + '人」的預約嗎？\n（不會寄取消信）')) return;
    busy(true);
    api('/api/admin/bookings/' + encodeURIComponent(editing.id) + '/cancel', { method: 'POST' })
      .then(function () { busy(false); closeModal(); load(); })
      .catch(function (err) { busy(false); $('mSave').textContent = '儲存'; showMMsg(err.message || '取消失敗。'); });
  });

  $('mClose').addEventListener('click', closeModal);
  $('mask').addEventListener('click', closeModal);
  $('prev').addEventListener('click', function () { load(week.prevMonday); });
  $('next').addEventListener('click', function () { load(week.nextMonday); });
  $('this').addEventListener('click', function () { load(week.thisMonday); });
  $('reload').addEventListener('click', function () { load(); });
  $('addNew').addEventListener('click', function () { openNew(null, null); });

  load();
</script>
</body>
</html>
