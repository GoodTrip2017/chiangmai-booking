<!DOCTYPE html>
<html lang="zh-Hant" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>取消預約 / Cancel booking — GoodTrip x Herb Uncle</title>
<style>
  :root { --bg: #1c1b18; --card: #25241f; --card-2: #2d2b26; --line: #403d36; --text: #f2eee6; --muted: #b8b2a7; --accent: #7fc04a; --warn: #e0a33c; --err: #e26d5a; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; line-height: 1.7; -webkit-text-size-adjust: 100%; }
  [data-lang="zh"] .en-only, [data-lang="en"] .zh-only { display: none !important; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 28px 24px 64px; }
  .lang-switch { display: flex; gap: 6px; justify-content: flex-end; margin: 0 0 18px; }
  .lang-btn { padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; border-radius: 999px; color: var(--muted); background: transparent; border: 1px solid var(--line); }
  .lang-btn.on { color: #10240a; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .brand { margin: 0 0 12px; color: #c6aa78; font-size: 12px; font-weight: 600; letter-spacing: .14em; }
  h1 { margin: 0 0 18px; font-size: clamp(24px, 6vw, 28px); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 10px 12px; margin: 0 0 18px; font-size: 15px; }
  dt { color: var(--muted); } dd { margin: 0; text-align: right; overflow-wrap: anywhere; }
  @media (max-width: 480px) { dl { grid-template-columns: 1fr; gap: 2px; } dd { text-align: left; margin-bottom: 8px; } }
  button.go { width: 100%; margin-top: 8px; padding: 15px; font-size: 16px; font-weight: 700; font-family: inherit; color: #fff; background: var(--err); border: 0; border-radius: 12px; cursor: pointer; }
  button.go:disabled { opacity: .5; cursor: default; }
  .msg { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14px; display: none; }
  .msg.show { display: block; }
  .msg.error { background: #3a201c; border: 1px solid var(--err); color: #ffd9d1; }
  .msg.info { background: #2d2a1c; border: 1px solid var(--warn); color: #f6e6c4; }
  .msg.ok { background: #23301a; border: 1px solid var(--accent); color: #dff3cc; }
  .hint { color: var(--muted); font-size: 13.5px; }
  a { color: var(--accent); }
  .foot { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-switch" role="group" aria-label="Language / 語言">
    <button type="button" class="lang-btn on" id="langZh">中文</button>
    <button type="button" class="lang-btn" id="langEn">English</button>
  </div>
  <p class="brand">GOODTRIP × HERB UNCLE</p>
  <h1><span class="zh-only">取消預約</span><span class="en-only">Cancel booking</span></h1>

  <div class="card" id="card">
    <p class="hint" id="intro"><span class="zh-only">請確認以下預約資料。取消後名額會立即釋出，我們會寄一封取消通知到您的信箱。</span><span class="en-only">Please check the booking below. Once cancelled, the places are released and a confirmation email is sent to you.</span></p>
    <dl id="details" hidden></dl>
    <div class="msg" id="status" role="status" aria-live="polite"></div>
    <button type="button" class="go" id="cancelButton" disabled>確認取消預約 / Confirm cancellation</button>
  </div>

  <p class="foot"><span class="zh-only">改期或其他需求，歡迎透過 <a href="https://lin.ee/DcpM9f7" target="_blank" rel="noopener noreferrer">LINE</a> 與我們聯絡。<br><a href="/">重新預約</a></span><span class="en-only">To reschedule or for anything else, contact us on <a href="https://lin.ee/DcpM9f7" target="_blank" rel="noopener noreferrer">LINE</a>.<br><a href="/">Book again</a></span></p>
</div>
<script src="/assets/cancel.js" defer></script>
</body>
</html>
