<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作人員登入 — GoodTrip x Herb Uncle 清邁尼曼店</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #14120f; color: #f2eee6; font: 16px/1.7 -apple-system, BlinkMacSystemFont, 'Noto Sans TC', sans-serif; padding: 24px; }
    main { width: min(100%, 400px); background: #1d1b17; border: 1px solid #3a342c; border-radius: 16px; padding: 28px; }
    img { display: block; width: 180px; max-width: 100%; margin: 0 auto 24px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: #a49c8e; font-size: 14px; }
    label { display: block; margin: 24px 0 8px; }
    input, button { width: 100%; border-radius: 9px; padding: 12px; font: inherit; }
    input { border: 1px solid #3a342c; background: #262218; color: #f2eee6; }
    input:focus, button:focus-visible { outline: 2px solid #7fc04a; outline-offset: 3px; }
    button { margin-top: 18px; border: 0; background: #7fc04a; color: #10240a; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; }
    #error { color: #ffd9d1; min-height: 24px; }
    a { color: #7fc04a; font-size: 14px; }
  </style>
  <script src="/assets/login.js" defer></script>
</head>
<body>
  <main>
    <img src="/logo.png" alt="GoodTrip x Herb Uncle">
    <h1>工作人員登入</h1>
    <p>登入後可查看與管理預約。使用完畢請登出，尤其是共用裝置。</p>
    <form id="loginForm">
      <input type="text" name="username" value="staff" autocomplete="username" hidden>
      <label for="password">後台密碼</label>
      <input id="password" type="password" name="password" autocomplete="current-password" maxlength="256" required autofocus>
      <button id="loginButton" type="submit">登入</button>
      <p id="error" role="alert" aria-live="polite"></p>
    </form>
    <a href="/">回預約頁</a>
  </main>
</body>
</html>
